name: Update profile art
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch contribution calendar
        env:
          GITHUB_USERNAME: adityayedpalwar
        run: python scripts/fetch_contributions.py
      - name: Render animated SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit changed art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
